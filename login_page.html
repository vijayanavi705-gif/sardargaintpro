<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Cloud Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Light gray background */
            display: flex;
            align-items: center;
            justify-content: center; 
            min-height: 100vh;
        }
        .login-card {
            background-color: #000000;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0px 0px 15px 3px #ff0030;
            width: 100%;
            max-width: 28rem;
            border: 1px solid #ff0030;
        }
        .form-input {
            margin-top: 0.25rem;
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #ff0020;
            border: 1px solid #ff0020;
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
        }
        .form-input:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #ff0030;
            box-shadow: 0 0 0 1px #ff0030;
        }
        .form-button {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0.75rem 1rem;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            font-weight: 500;
            color: #000000;
            background-color: #ff0020;
            transition: all 0.2s ease-in-out;
        }
        .form-button:hover {
            background-color: #ff0030;
        }
        .link {
            font-weight: 500;
            color: #ff0020;
            transition: color 0.2s ease-in-out;
        }
        .link:hover {
            color: #ff0030;
        }
        .message-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 0.875rem;
        }
        .message-success {
            background-color: #000000;
            color: #ff0030;
        }
        .message-error {
            background-color: #000000;
            color: #ff0030;
        }
    </style>
</head>
<body> 
    <div class="login-card">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back!</h1>
            <p class="text-gray-500">Log in to your account.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="message-box">
            {% for category, message in messages %}
            <div class="{% if category == 'success' %}message-success{% elif category == 'error' %}message-error{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="mt-8 space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@sgmail.com" class="form-input" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" class="form-input" required>
            </div>
            <div>
                <button type="submit" class="form-button">Log In</button>
            </div>
        </form>

        <p class="mt-6 text-center text-sm text-gray-500">
            Don't have an account?
            <a href="{{ url_for('signup') }}" class="link">Sign Up</a>
        </p>
    </div>
</body>
</html>
